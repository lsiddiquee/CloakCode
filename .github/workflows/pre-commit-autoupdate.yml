# =============================================================================
# Weekly staleness check for the PINNED pre-commit hooks that Dependabot cannot
# see. Dependabot has no `pre-commit` ecosystem, so the hosted `rev:` hooks in
# .pre-commit-config.yaml (gitleaks, markdownlint-cli2, conventional-pre-commit,
# pre-commit-hooks) never get an update PR and silently rot. This job flags that.
#
# ZERO-CODE-SYNC by design: this workflow NEVER pushes repo content. It has no
# `contents: write`, opens no branch, and runs no `git push`. On a stale hook it
# only opens/updates a tracking ISSUE (a text notification); a maintainer then
# reviews the tagged releases and updates pins locally. This deliberately avoids the
# common "auto-open a PR" pattern, which would require a push path in the repo.
#
# NOTE: ruff is intentionally NOT covered here — it is single-sourced via the
# Poetry dev dependency (pyproject.toml) and its pre-commit hook runs the venv
# binary, so a normal pip Dependabot PR keeps it current (see docs/06 field note
# "No duplicate tool-version pins").
# =============================================================================
name: pre-commit autoupdate check

on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC, alongside the Dependabot windows
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check pinned pre-commit hooks are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Detect stale hooks and notify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # autoupdate uses git describe on the default branch; release tags on
          # side branches (e.g. gitleaks v8.30.1) can be missed or downgraded.
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          path = Path(".pre-commit-config.yaml")
          text = path.read_text()
          hosted = re.findall(
              r"(?m)^  - repo: https://github.com/([\w.-]+/[\w.-]+)\n    rev: (v?\d+\.\d+\.\d+)$",
              text,
          )
          if len(hosted) != text.count("  - repo: https://github.com/"):
              raise ValueError("A hosted pre-commit hook has an unrecognized revision")
          for repo, pinned in hosted:
              tags = subprocess.check_output(
                  ["gh", "api", "--paginate", f"repos/{repo}/tags?per_page=100", "--jq", ".[].name"],
                  text=True,
              ).splitlines()
              stable = [
                  (tuple(map(int, match.groups())), tag)
                  for tag in tags
                  if (match := re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag))
              ]
              if not stable:
                  raise ValueError(f"No stable version tags found for {repo}")
              version, latest = max(stable)
              if version > tuple(map(int, pinned.lstrip("v").split("."))):
                  old = f"  - repo: https://github.com/{repo}\n    rev: {pinned}\n"
                  if text.count(old) != 1:
                      raise ValueError(f"Cannot update pinned revision for {repo}")
                  text = text.replace(
                      old, f"  - repo: https://github.com/{repo}\n    rev: {latest}\n", 1
                  )
          if text != path.read_text():
              path.write_text(text)
          PY
          if git diff --quiet -- .pre-commit-config.yaml; then
            echo "pre-commit hooks are up to date."
            exit 0
          fi
          diff="$(git --no-pager diff -- .pre-commit-config.yaml)"
          echo "Stale hooks detected:"
          echo "$diff"
          title="chore: pinned pre-commit hooks are out of date"
          body="$(printf 'The weekly check found newer pinned revisions for pre-commit hooks that Dependabot cannot bump (it has no `pre-commit` ecosystem).\n\nReview the release tags and update the pins locally (autoupdate may miss tags on side branches).\n\n```diff\n%s\n```\n' "$diff")"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label dependencies
          fi
